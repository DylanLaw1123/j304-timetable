<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>初三4 课程表</title>
<script>
(function(){var t=null;try{t=localStorage.getItem("tt-theme")}catch(e){}
if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
document.documentElement.setAttribute("data-theme",t);})();
</script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f6f4; --card:#ffffff; --ink:#1d2b2a; --muted:#6a7b79; --line:#d9e2df; --now:#0f766e;
  --华文:#fde2e0; --英文:#dbeafe; --数学:#fef3c7; --科学:#d9f2e3; --国文:#ede4fb;
  --地理:#ffe8d1; --历史:#f1e3d3; --联课活动:#cdf1f5; --other:#eceff0;
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121816; --card:#1b2421; --ink:#e7efed; --muted:#93a5a2; --line:#2c3935; --now:#2dd4bf;
  --华文:#4a2a2a; --英文:#22344f; --数学:#4a3d17; --科学:#1f4030; --国文:#3a2e55; --地理:#4a3220; --历史:#3e3126; --联课活动:#164650; --other:#27312e;}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.4}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
#btnTheme{flex:none;font:inherit;font-size:.9rem;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;white-space:nowrap}
#btnTheme:focus-visible{outline:2px solid var(--now);outline-offset:2px}
h1{font-size:1.6rem;margin:0}
.meta{color:var(--muted);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools button,.tools select{font:inherit;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--now);color:#fff;border-color:var(--now)}
.tools button:focus-visible,.tools select:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.panel{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.box .k{color:var(--muted);font-size:.8rem}
.box .v{font-size:1.15rem;font-weight:600;margin-top:2px}
.box .sub{color:var(--now);font-size:.9rem;font-variant-numeric:tabular-nums}
#clock{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
#date{color:var(--muted);font-size:.85rem}
#status{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-140%);top:calc(12px + env(safe-area-inset-top,0px));z-index:10;
  width:min(92vw,420px);background:var(--now);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  transition:transform .35s ease;cursor:pointer}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast b{display:block;font-size:1.05rem}
#toast span{font-size:.92rem}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1000px;table-layout:fixed}
th,td{border:1px solid var(--line);text-align:center;padding:8px 4px;font-size:.92rem}
thead th{font-weight:600;background:var(--card)}
thead th small{display:block;color:var(--muted);font-weight:400;font-size:.74rem}
tbody th{width:64px;background:var(--card)}
td .s{font-weight:600}
td .t{display:block;color:var(--muted);font-size:.78rem}
td.华文{background:var(--华文)}td.英文{background:var(--英文)}td.数学{background:var(--数学)}
td.科学{background:var(--科学)}td.国文{background:var(--国文)}td.地理{background:var(--地理)}
td.历史{background:var(--历史)}td.联课活动{background:var(--联课活动)}td.other{background:var(--other)}
td.dim{opacity:.22}
th.brk,td.brk{width:52px;background:var(--other);color:var(--muted);font-size:.8rem}
th.brk small{font-size:.66rem}
td.brk{writing-mode:vertical-rl;letter-spacing:.2em;padding:4px 0}
td.brk.h{writing-mode:horizontal-tb;letter-spacing:0;padding:8px 4px;font-size:.92rem;width:auto}
tr.today th{color:var(--now);box-shadow:inset 3px 0 0 var(--now)}
td.now{outline:3px solid var(--now);outline-offset:-3px}
th.nowcol{color:var(--now)}
.day{display:none}
footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.85rem;line-height:1.7}
footer a{color:var(--now)}
.bells{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.bells h2{font-size:1.05rem;margin:0 0 10px}
#bellTable{min-width:0;table-layout:auto;border:0}
#bellTable th,#bellTable td{border:0;border-bottom:1px solid var(--line);text-align:left;padding:8px 6px;vertical-align:middle}
#bellTable th{font-size:.8rem;color:var(--muted);font-weight:600}
#bellTable td small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
#bellTable select,#bellAll,#bellTable button{font:inherit;font-size:.9rem;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;max-width:100%}
#bellTable select:focus-visible,#bellAll:focus-visible,#bellTable button:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.bells .all{margin-top:12px;font-size:.9rem}
.bells .hint{color:var(--muted);font-size:.8rem;margin:10px 0 0}
.note{color:var(--muted);font-size:.8rem;margin-top:12px}
@media (max-width:640px){
  .scroll{display:none}
  .day{display:block}
  .day .row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .day .row .p{width:72px;font-size:.78rem;color:var(--muted);flex:none}
  .day .row .p b{display:block;color:var(--ink);font-size:.9rem}
  .day .row .c{flex:1;padding:8px 10px;border-radius:8px}
  .day .row.now .c{outline:3px solid var(--now)}
  .day .row.dim .c{opacity:.22}
  .daybox{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel{grid-template-columns:1fr 1fr}.panel .box:first-child{grid-column:1/-1}
}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<div class="wrap">
  <header>
    <div class="title"><h1>初三4 课程表</h1>
    <div class="meta">班主任：张晓甜老师（zxt）　生效日期：2026年1月12日</div></div>
    <button id="btnTheme" aria-label="切换黑白主题">🌙 黑色主题</button>
  </header>

  <div class="panel">
    <div class="box"><div id="clock">--:--:--</div><div id="date"></div></div>
    <div class="box"><div class="k">这一节</div><div class="v" id="cur">-</div><div class="sub" id="curSub"></div></div>
    <div class="box"><div class="k">下一节</div><div class="v" id="nxt">-</div><div class="sub" id="nxtSub"></div></div>
  </div>

  <div class="tools">
    <button id="btnWeek" aria-pressed="true">整周</button>
    <button id="btnToday" aria-pressed="false">今天</button>
    <select id="teacher" aria-label="按老师高亮"><option value="">全部老师</option></select>
    <button id="btnNotify" aria-pressed="false">🔔 通知：关</button>
    <button id="btnTest">测试通知</button>
    <span id="status"></span>
  </div>

  <div class="scroll"><table id="grid" aria-label="每周课程表"></table></div>
  <div class="daybox day" id="dayView"></div>

  <section class="bells" id="bellPanel">
    <h2>🔔 铃声设置</h2>
    <table id="bellTable" aria-label="铃声设置"></table>
    <div class="all">统一设置：<select id="bellAll" aria-label="所有事件统一使用同一种铃声"></select></div>
    <p class="hint">选“静音”就不响铃，只显示通知。</p>
  </section>

  <p class="note">美术(单) / 辅导(双)：第1、2节为单双周轮换。星期五第7节后 13:25–13:40 下课，13:40–15:40 为联课活动。数据按课表照片录入，如有出入请以学校为准。</p>
  <footer>
    <div>2026 初三4班 | Made By DylanLaw and ClaudeAI.</div>
    <div>有任何问题可以 Email：<a href="mailto:242187law@fyk.edu.my">242187law@fyk.edu.my</a></div>
  </footer>
</div>

<script>
const periods=[["07:30","08:10"],["08:10","08:50"],["09:10","09:50"],["09:50","10:30"],["10:45","11:25"],
["11:25","12:05"],["12:45","13:25"],["13:25","14:05"],["14:20","15:00"],["15:00","15:40"]];
const breaks=[["08:50","09:10","第一个下课"],["10:30","10:45","第二个下课"],["12:05","12:45","第三个下课"],["14:05","14:20","第四个下课"]];
const days=["星期一","星期二","星期三","星期四","星期五"];
// [科目, 老师]
const L=(s,t)=>[s,t];
const data=[
 [L("英文","wcl"),L("数学","cky2"),L("周/班会",""),L("地理","zxt"),L("科学","zjw"),L("科学","zjw"),L("华文","pmx"),L("数学","cky2"),L("国文","Sofea"),L("历史","wqy")],
 [L("电脑","zxll"),L("电脑","zxll"),L("国文","Sofea"),L("国文","Sofea"),L("华文","pmx"),L("华文","pmx"),L("科学","zjw"),L("英文","wcl"),L("地理","zxt"),L("数学","cky2")],
 [L("华文","pmx"),L("科学","zjw"),L("品格教育","zxt"),L("品格教育","zxt"),L("数学","cky2"),L("历史","wqy"),L("英文","wcl"),L("国文","Sofea"),L("自主学习",""),L("自主学习","")],
 [L("美术","zsm（单）"),L("辅导","lzy（双）"),L("国文","Sofea"),L("华文","pmx"),L("历史","wqy"),L("科学","zjw"),L("数学","cky2"),L("数学","cky2"),L("英文","wcl"),L("英文","wcl")],
 [L("国文","Sofea"),L("科学","zjw"),L("地理","zxt"),L("体育","hwc"),L("英文","wcl"),L("华文","pmx"),L("数学","cky2"),L("联课活动",""),L("联课活动",""),L("联课活动","")]
];
const colored=["华文","英文","数学","科学","国文","地理","历史","联课活动"];
const cls=s=>colored.includes(s)?s:"other";
const toMin=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};

const grid=document.getElementById("grid"), dayView=document.getElementById("dayView");
const sel=document.getElementById("teacher"), status=document.getElementById("status");
let mode="week", teacher="";

const tsub={};
data.flat().forEach(([sj,t])=>{if(!t)return;const k=t.replace(/（.*）/,"");(tsub[k]=tsub[k]||new Set()).add(sj);});
Object.keys(tsub).sort().forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=tn(t,[...tsub[t]].join("、"));sel.appendChild(o)});

const pad=n=>String(n).padStart(2,"0");
const fmtT=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const fmt=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60;return (h?h+"小时 ":"")+pad(m)+"分 "+pad(x)+"秒"};
const after={1:0,3:1,5:2,7:3}; // 第几节之后是第几个下课
function tn(t,subj){ // 老师名字后面加“老师”，可选在后面加（科目），保留（单）/（双）
  if(!t)return "";
  const m=t.match(/^([^（]+)(（.*）)?$/);
  return m?m[1]+"老师"+(subj?"（"+subj+"）":"")+(m[2]||""):t;
}
const nm=(r,i)=>`第${i+1}节 ${data[r][i][0]}${data[r][i][1]?"（"+tn(data[r][i][1])+"）":""}`;
const itemName=(r,it)=>it.merged?"联课活动":nm(r,it.i);

// 一天的时间线（上课 + 下课）。星期五第4个下课是 13:25–13:40，之后是联课活动 13:40–15:40
function items(r){
  const out=[], bk=k=>({t:"b",k,s:toMin(breaks[k][0]),e:toMin(breaks[k][1]),name:breaks[k][2]});
  for(let i=0;i<10;i++){
    if(r===4&&i>=7){
      if(i===7){out.push({t:"b",k:3,s:toMin("13:25"),e:toMin("13:40"),name:breaks[3][2]});
        out.push({t:"c",i:7,s:toMin("13:40"),e:toMin("15:40"),merged:true});}
      continue;
    }
    out.push({t:"c",i,s:toMin(periods[i][0]),e:toMin(periods[i][1])});
    if(after[i]!==undefined)out.push(bk(after[i]));
  }
  return out;
}
function now(){
  const d=new Date(), w=d.getDay();
  const di=w>=1&&w<=5?w-1:-1;
  return {di,m:d.getHours()*60+d.getMinutes()};
}
const dim=c=>teacher&&!c[1].startsWith(teacher);

function render(){
  const {di,m}=now();
  const cu=di>=0?items(di).find(x=>m>=x.s&&m<x.e):null;
  const pi=cu&&cu.t==="c"?cu.i:-1, bnow=cu&&cu.t==="b"?cu.k:-1;
  let h="<thead><tr><th>星期</th>";
  periods.forEach((p,i)=>{
    h+=`<th class="${i===pi?"nowcol":""}">第${i+1}节<small>${p[0]}–${p[1]}</small></th>`;
    if(after[i]!==undefined){const b=breaks[after[i]];h+=`<th class="brk ${after[i]===bnow?"nowcol":""}">下课<small>${b[0]}–${b[1]}</small></th>`;}
  });
  h+="</tr></thead><tbody>";
  const list=mode==="today"&&di>=0?[di]:[0,1,2,3,4];
  list.forEach(r=>{
    h+=`<tr class="${r===di?"today":""}"><th>${days[r]}</th>`;
    data[r].forEach((c,i)=>{
      if(r===4&&i>=8)return;
      if(r===4&&i===7){
        h+=`<td class="brk h${r===di&&bnow===3?" now":""}">下课<span class="t">13:25–13:40</span></td>`;
        h+=`<td colspan="3" class="联课活动${dim(c)?" dim":""}${r===di&&pi===7?" now":""}"><span class="s">联课活动</span><span class="t">13:40–15:40</span></td>`;
        return;
      }
      h+=`<td class="${cls(c[0])}${dim(c)?" dim":""}${r===di&&i===pi?" now":""}"><span class="s">${c[0]}</span>${c[1]?`<span class="t">${tn(c[1],c[0])}</span>`:""}</td>`;
      if(after[i]!==undefined)h+=`<td class="brk${r===di&&after[i]===bnow?" now":""}">下课</td>`;
    });
    h+="</tr>";
  });
  grid.innerHTML=h+"</tbody>";

  const v=di>=0?di:0;
  let rows=di<0?`<div class="row"><span class="p">周末休息<br>显示星期一</span></div>`:"";
  items(v).forEach(it=>{
    const t=`${fmtT(it.s)}–${fmtT(it.e)}`, on=v===di&&cu&&cu.t===it.t&&(it.t==="c"?cu.i===it.i:cu.k===it.k);
    if(it.t==="c"){
      const c=data[v][it.i];
      rows+=`<div class="row${on?" now":""}${dim(c)?" dim":""}"><span class="p"><b>${it.merged?"联课":"第"+(it.i+1)+"节"}</b>${t}</span><div class="c" style="background:var(--${cls(c[0])})"><span class="s" style="font-weight:600">${c[0]}</span> <span style="color:var(--muted);font-size:.8rem">${tn(c[1],c[0])}</span></div></div>`;
    }else{
      rows+=`<div class="row${on?" now":""}"><span class="p"><b>下课</b>${t}</span><div class="c" style="background:var(--other);color:var(--muted)">${it.name}</div></div>`;
    }
  });
  dayView.innerHTML=rows;
}
document.getElementById("btnWeek").onclick=e=>{mode="week";setBtn();render()};
document.getElementById("btnToday").onclick=e=>{mode="today";setBtn();render()};
function setBtn(){
  document.getElementById("btnWeek").setAttribute("aria-pressed",mode==="week");
  document.getElementById("btnToday").setAttribute("aria-pressed",mode==="today");
}
sel.onchange=()=>{teacher=sel.value;render()};

// ===== 主题 =====
const btnTheme=document.getElementById("btnTheme");
function themeBtn(){btnTheme.textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️ 白色主题":"🌙 黑色主题";}
btnTheme.onclick=()=>{
  const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("tt-theme",t)}catch(e){}
  themeBtn();
};
themeBtn();

// ===== 通知 =====
let notifyOn=false, audioCtx=null, toastTimer=0;
try{notifyOn=localStorage.getItem("tt-notify")==="1"}catch(e){}
const btnNotify=document.getElementById("btnNotify"), toastEl=document.getElementById("toast");
function setNotifyBtn(){btnNotify.setAttribute("aria-pressed",notifyOn);btnNotify.textContent=notifyOn?"🔔 通知：开":"🔔 通知：关";}
function toast(title,body){
  toastEl.innerHTML=`<b>${title}</b><span>${body}</span>`;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("show"),10000);
}
toastEl.onclick=()=>toastEl.classList.remove("show");
// ===== 铃声 =====
// 数字是相对中央 C 的半音数，null 是停顿；step 是每个音的间隔（秒）
const MELODIES=[
  {id:"m0",name:"校园钟声",step:0.6,dec:1.8,pre:4,notes:[4,0,2,-5,null,-5,2,4,0]}   // Mi Do Re Sol | Sol Re Mi Do
];
const BELLS=[["m0","校园钟声"],["beep","提示音"],["gong","铜钟"],["wind","风铃"],["electric","电铃"],["off","静音"]];
// kind: ring = 完整铃声，pre = 短版（预备铃）
const EVENTS=[
  {k:"start",label:"上课铃",desc:"下课结束、开始上课时",kind:"ring"},
  {k:"end",label:"下课铃",desc:"一节课结束、开始下课时",kind:"ring"},
  {k:"switch",label:"换节铃",desc:"连续两节课之间换节时（如第1节→第2节）",kind:"ring"},
  {k:"dismiss",label:"放学铃",desc:"放学时",kind:"ring"},
  {k:"preBreak",label:"预备铃（下课）",desc:"下课结束前3分钟，铃声的短版",kind:"pre"},
  {k:"preDismiss",label:"预备铃（放学）",desc:"放学前3分钟，铃声的短版",kind:"pre"}
];
const bellCfg={};
(function(){
  let old="m0";try{const v=localStorage.getItem("tt-bell");if(["m0","gong","wind","electric"].includes(v))old=v;}catch(e){}
  let saved={};try{saved=JSON.parse(localStorage.getItem("tt-bells")||"{}")||{};}catch(e){}
  EVENTS.forEach(e=>{bellCfg[e.k]=BELLS.some(b=>b[0]===saved[e.k])?saved[e.k]:old;});
})();
function saveBells(){try{localStorage.setItem("tt-bells",JSON.stringify(bellCfg))}catch(e){}}
const bellName=id=>(BELLS.find(b=>b[0]===id)||BELLS[0])[1];
function ringSynth(kind,style="m0"){
  const AC=window.AudioContext||window.webkitAudioContext;
  audioCtx=audioCtx||new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const ac=audioCtx, t0=ac.currentTime+0.03;
  const hit=(t,f,vol,dec)=>[1,2.4,3.9,5.9].forEach((m,i)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine";o.frequency.value=f*m;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol/(i+1),t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
    o.start(t);o.stop(t+dec+0.02);
  });
  const tone=(t,f,dec,vol,parts)=>parts.forEach(([m,a])=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine";o.frequency.value=f*m;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol*a,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
    o.start(t);o.stop(t+dec+0.05);
  });
  const semi=n=>261.63*Math.pow(2,n/12);
  const CH=[[1,1],[2,0.45],[3,0.2],[4.2,0.1]];
  const mel=MELODIES.find(x=>x.id===style);
  if(kind!=="ding"&&mel){                       // 旋律钟声
    (kind==="pre"?mel.notes.slice(0,mel.pre):mel.notes).forEach((n,i)=>{if(n!==null)tone(t0+i*mel.step,semi(n),mel.dec,0.3,CH);});
    return;
  }
  if(kind!=="ding"&&style==="beep"){            // 最初的提示音：两声“叮—咚”
    const n=kind==="pre"?1:2;
    for(let r=0;r<n;r++)[0,0.22].forEach((dt,j)=>{
      const o=ac.createOscillator(),g=ac.createGain(),T=t0+r*0.8+dt;
      o.frequency.value=j?1040:784;o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,T);
      g.gain.exponentialRampToValueAtTime(0.25,T+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,T+0.2);
      o.start(T);o.stop(T+0.21);
    });
    return;
  }
  if(kind!=="ding"&&style==="gong"){        // 铜钟：低沉的“咚——”
    const n=kind==="pre"?2:3;
    for(let i=0;i<n;i++)tone(t0+i*1.7,130.81,3.2,0.38,[[1,1],[2.76,0.5],[5.4,0.28],[8.93,0.12]]);
    return;
  }
  if(kind!=="ding"&&style==="wind"){        // 风铃：高音的随机叮叮声
    const P=[12,14,16,19,21,24,26,28], n=kind==="pre"?6:14;
    for(let i=0;i<n;i++)tone(t0+i*0.13+Math.random()*0.05,semi(P[Math.floor(Math.random()*P.length)]),1.6,0.16,CH);
    return;
  }
  const burst=(start,n,f,vol)=>{for(let i=0;i<n;i++)hit(start+i*0.085,f,vol,0.2);};
  if(kind==="ding"){hit(t0,1000,0.2,0.8);}
  else if(kind==="pre"){burst(t0,9,1250,0.09);burst(t0+1.05,9,1250,0.09);}      // 预备铃：叮铃铃 ×2
  else{burst(t0,12,1450,0.1);burst(t0+1.3,12,1450,0.1);burst(t0+2.6,12,1450,0.1);} // 上课/下课铃：叮铃铃 ×3
}
function beep(kind="ding",style="m0"){
  try{
    if(style==="off")return;
    ringSynth(kind,style);
  }catch(e){}
}
function playEvent(k){const ev=EVENTS.find(e=>e.k===k);if(ev)beep(ev.kind,bellCfg[k]);}
function msgFor(di,p,n){
  const pn=p.t==="c"?itemName(di,p):p.name;
  if(!n)return ["放学啦",`${pn}结束了，放学啦！${di===4?"周末愉快～":"明天见～"}`,"dismiss"];
  const nn=(n.t==="c"?itemName(di,n):n.name)+`，${fmtT(n.s)}–${fmtT(n.e)}`;
  const ev=p.t==="b"?"start":(n.t==="b"?"end":"switch");
  return [{start:"上课啦",end:"下课啦",switch:"换节啦"}[ev],`${pn}结束了，接下来是${nn}`,ev];
}
function notify(title,body,ev){
  toast(title,body);if(ev)playEvent(ev);
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
  showSys(title,body);
}
// 系统通知：优先走 Service Worker，这样切到其他标签页也能弹出
async function showSys(title,body){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  try{
    if("serviceWorker" in navigator){
      const reg=await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),2000))]);
      if(reg){await reg.showNotification(title,{body,tag:"timetable",renotify:true,vibrate:[200,100,200]});return;}
    }
  }catch(e){}
  try{new Notification(title,{body,tag:"timetable"});}catch(e){}
}
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
btnNotify.onclick=async()=>{
  notifyOn=!notifyOn;
  try{localStorage.setItem("tt-notify",notifyOn?"1":"0")}catch(e){}
  setNotifyBtn();
  if(notifyOn){
    beep(); // 在点击时解锁声音
    if("Notification" in window&&Notification.permission==="default"){try{await Notification.requestPermission();}catch(e){}}
    if(!("Notification" in window)||Notification.permission!=="granted")toast("已开启页内提醒","浏览器没有授权系统通知，所以只会在页面里弹窗并响铃。页面需要保持打开。");
    else toast("已开启通知","每次换节、下课、上课、放学都会提醒你。页面需要保持打开。");
  }
};
document.getElementById("btnTest").onclick=async()=>{
  const has="Notification" in window;
  if(has&&Notification.permission==="default"){try{await Notification.requestPermission();}catch(e){}}
  {
    const nw=now(), d0=nw.di>=0?nw.di:0, list=items(d0);
    let k=list.findIndex(x=>nw.m>=x.s&&nw.m<x.e);
    if(k<0)k=list.findIndex(x=>x.s>nw.m);
    if(k<0)k=list.length-1;
    const [t,m2,ev]=msgFor(d0,list[k],list[k+1]||null);
    notify("测试："+t,(nw.di<0?"（今天休息，用星期一举例）":"")+m2,ev);
  }
  let tip="";
  if(location.protocol==="file:")tip="现在是本地文件打开的，系统通知不会生效。请用 https://用户名.github.io/... 的网址打开。";
  else if(!has)tip="这个浏览器不支持系统通知，只会有页面弹窗和提示音。";
  else if(Notification.permission==="denied")tip="通知被浏览器拦截了。点地址栏左边的图标 → 网站设置 → 通知 → 允许，然后刷新页面再试。";
  else if(Notification.permission!=="granted")tip="还没有授权通知，请在浏览器弹窗里点“允许”后再试一次。";
  if(tip)setTimeout(()=>toast("没有收到系统通知？",tip),1800);
};
// ===== 铃声设置面板 =====
const bellTable=document.getElementById("bellTable"), bellAll=document.getElementById("bellAll");
function buildBellPanel(){
  const opts=id=>BELLS.map(b=>`<option value="${b[0]}"${b[0]===id?" selected":""}>${b[1]}</option>`).join("");
  bellTable.innerHTML="<thead><tr><th>事件</th><th>铃声</th><th></th></tr></thead><tbody>"+
    EVENTS.map(e=>`<tr><td><b>${e.label}</b><small>${e.desc}</small></td><td><select data-k="${e.k}" aria-label="${e.label}的铃声">${opts(bellCfg[e.k])}</select></td><td><button data-t="${e.k}">试听</button></td></tr>`).join("")+"</tbody>";
  bellAll.innerHTML='<option value="">选择…</option>'+BELLS.map(b=>`<option value="${b[0]}">${b[1]}</option>`).join("");
}
function previewEvent(k){
  const ev=EVENTS.find(e=>e.k===k);
  toast("现在是"+ev.label,"铃声："+bellName(bellCfg[k])+(bellCfg[k]!=="off"&&ev.kind==="pre"?"（短版）":""));
  playEvent(k);
}
bellTable.onchange=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){bellCfg[k]=e.target.value;saveBells();}};
bellTable.onclick=e=>{const k=e.target.dataset&&e.target.dataset.t;if(k)previewEvent(k);};
bellAll.onchange=()=>{
  const v=bellAll.value;if(!v)return;
  EVENTS.forEach(e=>{bellCfg[e.k]=v;});saveBells();buildBellPanel();
  toast("已统一设置","所有事件都使用："+bellName(v));
};
buildBellPanel();
setNotifyBtn();

let prev={key:null,it:null,di:-1};
let lastSec=null,lastDi=-2;
let lastKey="";
function tick(){
  const d=new Date(), w=d.getDay(), sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
  document.getElementById("clock").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  document.getElementById("date").textContent=`${d.getMonth()+1}月${d.getDate()}日 星期${"日一二三四五六"[w]}`;
  const di=w>=1&&w<=5?w-1:-1, first=toMin(periods[0][0])*60;
  let cur="-",curSub="",nxt="-",nxtSub="",cu=null;
  if(di<0){
    cur="今天休息";
    nxt="星期一 "+nm(0,0); nxtSub="还有 "+fmt((w===6?2:1)*86400-sec+first);
  }else{
    const it=items(di);
    cu=it.find(x=>sec>=x.s*60&&sec<x.e*60);
    const nx=it.find(x=>x.t==="c"&&x.s*60>sec);
    if(cu){
      cur=cu.t==="c"?itemName(di,cu):cu.name; curSub="还剩 "+fmt(cu.e*60-sec);
    }else cur=sec<first?"还没上课":"今天的课已结束";
    if(nx){nxt=itemName(di,nx);nxtSub="还有 "+fmt(nx.s*60-sec);}
    else{
      const nd=(di+1)%5, add=di===4?3:1;
      nxt=days[nd]+" "+nm(nd,0); nxtSub="还有 "+fmt(add*86400-sec+first);
    }
  }
  cur_.textContent=cur;curSub_.textContent=curSub;nxt_.textContent=nxt;nxtSub_.textContent=nxtSub;
  // 状态切换提醒
  const ck=di<0?"off":(cu?di+":"+cu.t+":"+(cu.t==="c"?cu.i:cu.k):(sec<first?"pre":"post"));
  if(notifyOn&&prev.key!==null&&ck!==prev.key&&prev.it&&prev.di===di&&sec-prev.it.e*60>=0&&sec-prev.it.e*60<180){
    if(cu||ck==="post"){const [t,m2,ev]=msgFor(di,prev.it,cu);notify(t,m2,ev);}
  }
  // 预备铃：每个下课结束前3分钟、放学前3分钟
  if(notifyOn&&lastSec!==null&&lastDi===di&&di>=0){
    const it2=items(di);
    it2.forEach((x,idx)=>{
      const isBreak=x.t==="b", isLast=idx===it2.length-1, T=x.e*60-180;
      if(!(isBreak||isLast))return;
      if(lastSec<T&&sec>=T&&sec-T<180){
        if(isBreak){const n=it2[idx+1];notify("预备铃",`${x.name}还有3分钟结束，接下来是${itemName(di,n)}，${fmtT(n.s)}–${fmtT(n.e)}`,"preBreak");}
        else notify("预备铃",`${itemName(di,x)}还有3分钟结束，3分钟后放学啦！`,"preDismiss");
      }
    });
  }
  lastSec=sec;lastDi=di;
  prev={key:ck,it:cu,di};
  const key=di+"-"+cur;
  if(key!==lastKey){lastKey=key;render();}
}
const cur_=document.getElementById("cur"),curSub_=document.getElementById("curSub"),
      nxt_=document.getElementById("nxt"),nxtSub_=document.getElementById("nxtSub");
// 用 Web Worker 计时：切到别的标签页时不会被浏览器降频，通知更准时
function startClock(){
  try{
    const w=new Worker(URL.createObjectURL(new Blob(["setInterval(()=>postMessage(1),1000)"],{type:"text/javascript"})));
    w.onmessage=tick;
  }catch(e){setInterval(tick,1000);}
  if(document.addEventListener)document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
}
render(); tick(); startClock();
</script>
